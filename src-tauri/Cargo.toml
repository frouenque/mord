[package]
name = "mord"
version = "0.1.0"
description = "Mord — éditeur Markdown WYSIWYG façon Word"
authors = ["Mord contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "mord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
